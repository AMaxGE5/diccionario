<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PvZ: Extreme Survival - Miner & Split Pea</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; user-select: none; }
        
        /* Menús */
        #menu-container, #seed-selection-screen { position: absolute; width: 100%; height: 100%; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; }
        #menu-container { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=2070&auto=format&fit=crop'); background-size: cover; }
        #seed-selection-screen { background: #2c1e14; display: none; border: 10px solid #4e342e; }

        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .level-btn { width: 180px; height: 100px; background: #4caf50; border: 4px solid #1b5e20; color: white; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 10px; }
        
        .slot-container { display: flex; gap: 8px; background: #3e2723; padding: 15px; border-radius: 10px; margin-bottom: 20px; min-width: 600px; justify-content: center; }
        .pool-container { display: flex; gap: 10px; flex-wrap: wrap; background: #5d4037; padding: 20px; border-radius: 10px; width: 800px; justify-content: center; }
        
        .seed-card { width: 75px; height: 95px; background: #795548; border: 3px solid #3e2723; cursor: pointer; display: flex; flex-direction: column; align-items: center; border-radius: 5px; position: relative; }
        .seed-card.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .seed-card.selected { border-color: #fff; box-shadow: 0 0 10px #fff; }
        .seed-card span { font-size: 12px; font-weight: bold; margin-top: 5px; text-shadow: 1px 1px #000; }
        .cooldown-overlay { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); height: 0%; pointer-events: none; }

        /* Interfaz de Juego */
        #ui-panel { width: 1000px; height: 110px; background: #4d3a29; display: none; align-items: center; padding: 0 15px; gap: 10px; border-bottom: 5px solid #241a12; }
        #sun-counter { background: #ffd54f; color: #332; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 24px; border: 3px solid #f57f17; }
        
        #game-container { position: relative; width: 900px; height: 600px; display: none; border: 8px solid #3e2723; }
        canvas { background: #4caf50; }

        #wave-panel { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; width: 180px; text-align: center; }
        .wave-bar-bg { background: #333; height: 10px; border-radius: 5px; margin-top: 5px; }
        #wave-bar { background: #f44336; height: 100%; width: 0%; border-radius: 5px; transition: width 0.3s; }
        
        .btn-game { padding: 10px; background: #607d8b; border: 2px solid #37474f; border-radius: 5px; cursor: pointer; color: white; }
        .action-btn { padding: 15px 30px; background: #4caf50; border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="menu-container">
    <h1 style="font-size: 50px; text-shadow: 4px 4px #000;">PLANTS VS ZOMBIES: EXTREME</h1>
    <div class="level-grid">
        <button class="level-btn" onclick="prepareLevel(1)">NIVEL 1<br>Día ☀️</button>
        <button class="level-btn" onclick="prepareLevel(2)">NIVEL 2<br>Noche 🌙</button>
    </div>
</div>

<div id="seed-selection-screen">
    <h2>SELECCIONA TUS PLANTAS (MÁX 7)</h2>
    <div class="slot-container" id="chosen-seeds"></div>
    <div class="pool-container" id="pool-seeds"></div>
    <button class="action-btn" style="margin-top:20px" id="start-btn" onclick="startGame()" disabled>¡A DEFENDER!</button>
</div>

<div id="ui-panel">
    <div id="sun-counter">☀️ 150</div>
    <div id="ingame-seeds" style="display:flex; gap:5px"></div>
    <button id="shovel-btn" class="btn-game" onclick="toggleShovel()">🧹</button>
    <button id="speed-btn" class="btn-game" onclick="toggleSpeed()">x1</button>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div id="wave-panel">
        <div id="wave-text" style="font-size: 12px; color: #ffeb3b;">OLEADA 1 / 10</div>
        <div class="wave-bar-bg"><div id="wave-bar"></div></div>
    </div>
</div>

<script>
/** @type {HTMLCanvasElement} */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CONFIGURACIÓN ---
const cellSize = 100;
let currentLevel = 1, resources = 150, frame = 0, gameSpeed = 1, wave = 1, waveProgress = 0;
let isNight = false, gameOver = false, selectedPlant = null, shovelActive = false;
let playerDeck = [];
let plants = [], zombies = [], projectiles = [], suns = [], explosions = [];

const plantTypes = {
    'lanzaguisantes': { cost: 100, hp: 100, color: '#4caf50', cooldown: 300, type: 'diurna' },
    'girasol': { cost: 50, hp: 80, color: '#ffeb3b', cooldown: 300, type: 'diurna' },
    'nuez': { cost: 50, hp: 2000, color: '#a1887f', cooldown: 900, type: 'diurna' },
    'bipetidora': { cost: 175, hp: 120, color: '#8bc34a', cooldown: 350, type: 'diurna' },
    'setasolar': { cost: 25, hp: 80, color: '#fff59d', cooldown: 300, type: 'nocturna' },
    'setadesesporada': { cost: 0, hp: 50, color: '#9c27b0', cooldown: 150, type: 'nocturna' },
    'papapum': { cost: 25, hp: 100, color: '#795548', cooldown: 800, type: 'diurna' }
};

let cooldowns = {};

// --- LÓGICA DE DIBUJO ---
function drawPlant(p) {
    ctx.save();
    ctx.translate(p.x + 50, p.y + 50);
    if (p.sleeping) ctx.globalAlpha = 0.6;
    
    ctx.fillStyle = plantTypes[p.type].color;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;

    if (p.type === 'lanzaguisantes' || p.type === 'bipetidora') {
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(25, 0, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke(); // Boca
        if (p.type === 'bipetidora') {
            ctx.fillStyle = '#689f38';
            ctx.beginPath(); ctx.arc(-25, 0, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke(); // Cabeza atrás
        }
    } else if (p.type === 'girasol' || p.type === 'setasolar') {
        ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    } else if (p.type === 'nuez') {
        ctx.beginPath(); ctx.ellipse(0, 0, 25, 35, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    } else if (p.type === 'papapum') {
        ctx.fillStyle = p.ready ? '#f44336' : '#5d4037';
        ctx.beginPath(); ctx.arc(0, 20, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    } else {
        ctx.fillRect(-15, -20, 30, 40); ctx.strokeRect(-15, -20, 30, 40);
    }
    
    if (p.sleeping) {
        ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial"; ctx.fillText("Zzz", 5, -20);
    }
    ctx.restore();
}

function drawZombie(z) {
    ctx.save();
    ctx.translate(z.x + 50, z.y + 50);
    
    if (z.digging) {
        ctx.fillStyle = '#5d4037'; ctx.beginPath(); ctx.arc(0, 40, 30, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#7cb342'; ctx.beginPath(); ctx.arc(0, 30, 15, 0, Math.PI*2); ctx.fill();
    } else {
        ctx.fillStyle = z.type === 'invocador' ? '#4a148c' : '#7cb342';
        ctx.fillRect(-20, -10, 40, 50); ctx.strokeRect(-20, -10, 40, 50);
        ctx.fillStyle = '#558b2f'; ctx.beginPath(); ctx.arc(0, -25, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        if (z.type === 'miner') { ctx.fillStyle = '#fdd835'; ctx.fillRect(-15, -45, 30, 10); }
    }
    ctx.restore();
}

// --- LÓGICA DE JUEGO ---
function prepareLevel(lvl) {
    currentLevel = lvl;
    document.getElementById('menu-container').style.display = 'none';
    document.getElementById('seed-selection-screen').style.display = 'flex';
    renderSelection();
}

function renderSelection() {
    const chosenDiv = document.getElementById('chosen-seeds');
    const poolDiv = document.getElementById('pool-seeds');
    chosenDiv.innerHTML = ''; poolDiv.innerHTML = '';

    for (let i = 0; i < 7; i++) {
        const slot = document.createElement('div');
        slot.className = playerDeck[i] ? 'seed-card' : 'seed-card disabled';
        if (playerDeck[i]) {
            slot.innerHTML = `<span>${plantTypes[playerDeck[i]].cost}</span>`;
            slot.style.backgroundColor = plantTypes[playerDeck[i]].color;
            slot.onclick = () => { playerDeck.splice(i, 1); renderSelection(); };
        }
        chosenDiv.appendChild(slot);
    }

    Object.keys(plantTypes).forEach(key => {
        if (!playerDeck.includes(key)) {
            const card = document.createElement('div');
            card.className = 'seed-card';
            card.style.backgroundColor = plantTypes[key].color;
            card.innerHTML = `<span>${plantTypes[key].cost}</span>`;
            card.onclick = () => { if (playerDeck.length < 7) { playerDeck.push(key); renderSelection(); } };
            poolDiv.appendChild(card);
        }
    });
    document.getElementById('start-btn').disabled = playerDeck.length === 0;
}

function startGame() {
    document.getElementById('seed-selection-screen').style.display = 'none';
    document.getElementById('ui-panel').style.display = 'flex';
    document.getElementById('game-container').style.display = 'block';
    
    playerDeck.forEach(k => cooldowns[k] = 0);
    renderInGameUI();
    loop();
}

function spawnZombie(count) {
    // 10% incremento vida (base 110)
    const baseHp = (110 + (wave * 20));
    
    for (let i = 0; i < count; i++) {
        let type = 'normal';
        let rand = Math.random();
        if (wave >= 4 && rand < 0.2) type = 'miner';
        else if (wave >= 6 && rand < 0.15) type = 'invocador';

        zombies.push({
            x: 950 + (i * 40),
            y: Math.floor(Math.random() * 6) * cellSize,
            hp: baseHp * (type === 'invocador' ? 1.5 : 1),
            speed: 0.4,
            type: type,
            digging: (type === 'miner'),
            summonT: 0,
            reverse: false
        });
    }
}

function loop() {
    if (gameOver) return;

    for (let s = 0; s < gameSpeed; s++) {
        frame++;

        // --- SISTEMA DE OLEADAS MEJORADO ---
        if (frame % 350 === 0 && waveProgress < 100) {
            waveProgress += 5;
            
            let spawnCount = 0;
            // Lógica inicial lenta (Oleada 1 y 2)
            if (wave === 1) {
                if (waveProgress === 30 || waveProgress === 70) spawnCount = 1;
                if (waveProgress === 95) spawnCount = 2;
            } else if (wave === 2) {
                if (waveProgress % 40 === 0) spawnCount = 1;
                if (waveProgress === 95) spawnCount = 2;
            } else {
                // Multiplicadores según pedido
                let mult = 1;
                if (wave >= 10) mult = 3.5;      // Ultima oleada: Muchísimos
                else if (wave >= 8) mult = 1.6;  // +60%
                else if (wave >= 3) mult = 1.3;  // +30%
                
                if (Math.random() < 0.2 * mult) spawnCount = 1;
            }
            if (spawnCount > 0) spawnZombie(spawnCount);
        }

        if (waveProgress >= 100 && zombies.length === 0 && wave < 10) {
            wave++; waveProgress = 0;
            if (currentLevel === 2 && wave === 6) isNight = true;
            spawnZombie(wave);
            updateWaveUI();
        }

        // --- LÓGICA DE PLANTAS ---
        const isZombieInGarden = zombies.some(z => z.x < 900 && !z.digging);

        plants.forEach(p => {
            p.t++;
            // Girasoles 25% más lentos (800 ticks)
            let sunRate = (p.type === 'girasol' || p.type === 'setasolar') ? 800 : 0;
            if (sunRate > 0 && p.t % sunRate === 0 && !p.sleeping) {
                suns.push({x: p.x + 20, y: p.y + 20, targetY: p.y + 20, timer: 400});
            }

            // Atacar solo si hay zombies
            if (isZombieInGarden && !p.sleeping) {
                if (p.type === 'lanzaguisantes' && p.t % 90 === 0) {
                    projectiles.push({x: p.x + 70, y: p.y + 40, vx: 7});
                }
                if (p.type === 'bipetidora' && p.t % 90 === 0) {
                    projectiles.push({x: p.x + 70, y: p.y + 40, vx: 7}); // Frontal
                    projectiles.push({x: p.x + 10, y: p.y + 35, vx: -7}); // Trasero 1
                    projectiles.push({x: p.x + 10, y: p.y + 45, vx: -7}); // Trasero 2
                }
                if (p.type === 'setadesesporada' && p.t % 60 === 0) {
                    projectiles.push({x: p.x + 60, y: p.y + 40, vx: 5, range: 300, startX: p.x});
                }
            }
            
            if (p.type === 'papapum' && !p.ready && p.t > 400) p.ready = true;
        });

        // --- LÓGICA DE ZOMBIES ---
        zombies.forEach(z => {
            if (z.type === 'invocador') {
                z.summonT++;
                if (z.summonT % 500 === 0) spawnZombie(1);
            }

            if (z.digging) {
                z.x -= z.speed * 4;
                if (z.x < 20) { z.digging = false; z.reverse = true; } // Emerge en la última casilla y vuelve
            } else {
                let eating = false;
                plants.forEach(p => {
                    if (z.y === p.y && Math.abs(z.x - p.x) < 30) {
                        eating = true; p.hp -= 0.5;
                    }
                });

                if (!eating) {
                    z.x += z.speed * (z.reverse ? 1.2 : -1);
                }

                if (z.x < -60 || z.x > 960) gameOver = true;
            }
        });

        // --- LÓGICA PROYECTILES ---
        projectiles.forEach((pr, i) => {
            pr.x += pr.vx;
            if (pr.range && Math.abs(pr.x - pr.startX) > pr.range) projectiles.splice(i, 1);
            
            zombies.forEach(z => {
                if (!z.digging && z.y === (pr.y - 40) && Math.abs(pr.x - (z.x + 50)) < 40) {
                    z.hp -= 20; projectiles.splice(i, 1);
                }
            });
        });

        // Limpieza
        plants = plants.filter(p => p.hp > 0);
        zombies = zombies.filter(z => z.hp > 0);
        suns.forEach((s, i) => { s.timer--; if (s.timer <= 0) suns.splice(i, 1); });
        Object.keys(cooldowns).forEach(k => { if(cooldowns[k] > 0) cooldowns[k]--; });
    }

    render();
    if (!gameOver) requestAnimationFrame(loop);
    else alert("GARDEN OVER! Recarga la página.");
}

function render() {
    ctx.clearRect(0, 0, 900, 600);
    // Suelo
    for(let i=0; i<9; i++) for(let j=0; j<6; j++) {
        ctx.fillStyle = (i+j)%2 === 0 ? '#4caf50' : '#43a047';
        ctx.fillRect(i*cellSize, j*cellSize, cellSize, cellSize);
    }
    
    plants.forEach(drawPlant);
    zombies.forEach(drawZombie);
    projectiles.forEach(pr => {
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(pr.x, pr.y, 8, 0, Math.PI*2); ctx.fill();
    });
    suns.forEach(s => {
        ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(s.x, s.y, 15, 0, Math.PI*2); ctx.fill();
    });

    document.getElementById('sun-counter').innerText = `☀️ ${resources}`;
    document.getElementById('wave-bar').style.width = `${waveProgress}%`;
}

// --- INTERACCIÓN ---
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    // Recoger soles
    suns.forEach((s, i) => {
        if(Math.hypot(mx - s.x, my - s.y) < 40) { resources += 25; suns.splice(i, 1); }
    });

    const gx = Math.floor(mx/100)*100, gy = Math.floor(my/100)*100;

    if (shovelActive) {
        plants = plants.filter(p => !(p.x === gx && p.y === gy));
        shovelActive = false;
        return;
    }

    if (selectedPlant && resources >= plantTypes[selectedPlant].cost) {
        if (!plants.some(p => p.x === gx && p.y === gy)) {
            const type = plantTypes[selectedPlant].type;
            const sleeping = (isNight && type === 'diurna') || (!isNight && type === 'nocturna');
            
            plants.push({x: gx, y: gy, type: selectedPlant, hp: plantTypes[selectedPlant].hp, t: 0, sleeping, ready: false});
            resources -= plantTypes[selectedPlant].cost;
            cooldowns[selectedPlant] = plantTypes[selectedPlant].cooldown;
            selectedPlant = null;
            renderInGameUI();
        }
    }
});

function renderInGameUI() {
    const container = document.getElementById('ingame-seeds');
    container.innerHTML = '';
    playerDeck.forEach(k => {
        const div = document.createElement('div');
        div.className = `seed-card ${resources < plantTypes[k].cost ? 'disabled' : ''} ${selectedPlant === k ? 'selected' : ''}`;
        div.style.backgroundColor = plantTypes[k].color;
        div.innerHTML = `<span>${plantTypes[k].cost}</span><div class="cooldown-overlay" id="cd-${k}"></div>`;
        div.onclick = () => { if(resources >= plantTypes[k].cost) selectedPlant = k; renderInGameUI(); };
        container.appendChild(div);
    });
}

function toggleShovel() { shovelActive = !shovelActive; selectedPlant = null; }
function toggleSpeed() { gameSpeed = gameSpeed === 1 ? 2 : 1; document.getElementById('speed-btn').innerText = `x${gameSpeed}`; }
function updateWaveUI() { document.getElementById('wave-text').innerText = `OLEADA ${wave} / 10`; }

setInterval(() => {
    if (document.getElementById('ui-panel').style.display === 'flex') renderInGameUI();
}, 500);

</script>
</body>
</html>
