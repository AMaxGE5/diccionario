<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PvZ: Definitive Edition - Nivel 1</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Arial Black', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; user-select: none; }
        
        /* Menú Principal */
        #menu-container { position: absolute; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1524143878510-e3b8d6312402?q=80&w=1000&auto=format&fit=crop'); background-size: cover; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .level-btn { width: 180px; height: 120px; background: #4e342e; border: 5px solid #241a12; color: #fff; font-size: 22px; cursor: pointer; border-radius: 15px; box-shadow: 0 8px 0 #241a12; transition: 0.1s; }
        .level-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #241a12; }
        .level-btn.locked { background: #222; border-color: #000; cursor: not-allowed; opacity: 0.7; box-shadow: none; }

        /* Interfaz de Juego */
        #ui-panel { width: 1000px; height: 110px; background: #4d3a29; display: none; align-items: center; padding: 0 15px; border-bottom: 5px solid #241a12; gap: 10px; z-index: 10; }
        #sun-counter { background: #ffd54f; color: #332; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 24px; border: 4px solid #f57f17; min-width: 90px; text-align: center; }
        .seed-packets { display: flex; gap: 6px; }
        .seed { width: 75px; height: 95px; background: #795548; border: 3px solid #3e2723; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; border-radius: 5px; overflow: hidden; font-size: 11px; }
        .seed canvas { background: #a1887f; margin-top: 2px; border-radius: 3px; }
        .seed.selected { border-color: #fff; background: #d7ccc8; }
        .seed.disabled { filter: grayscale(1); opacity: 0.6; }
        .seed.locked { background: #222; justify-content: center; text-align: center; color: #ff5252; border-color: #000; }
        .seed .cooldown-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0,0,0,0.7); pointer-events: none; }
        
        .controls { display: flex; gap: 8px; margin-left: auto; }
        .btn { width: 55px; height: 55px; border-radius: 10px; cursor: pointer; border: 3px solid #37474f; font-size: 22px; display: flex; align-items: center; justify-content: center; background: #607d8b; color: white; }
        .btn.active { background: #fff; color: #333; border-color: #4caf50; }

        #game-container { position: relative; width: 900px; height: 600px; margin-top: 15px; border: 8px solid #3e2723; border-radius: 15px; display: none; background: #4caf50; }
        #announcement { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ffeb3b; font-size: 45px; text-shadow: 4px 4px #000; display: none; z-index: 50; pointer-events: none; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

<div id="menu-container">
    <h1 style="font-size: 70px; text-shadow: 8px 8px #000; color: #8bc34a; margin-bottom: 10px;">PLANTAS VS ZOMBIES</h1>
    <h2 style="margin-top: 0;">MUNDO 1: EL JARDÍN</h2>
    <div class="level-grid">
        <button class="level-btn" onclick="startGame(1)">NIVEL 1</button>
        <button class="level-btn locked">NIVEL 2<br>🔒</button>
        <button class="level-btn locked">NIVEL 3<br>🔒</button>
        <button class="level-btn locked">NIVEL 4<br>🔒</button>
    </div>
</div>

<div id="ui-panel">
    <div id="sun-counter">☀️ 150</div>
    <div class="seed-packets" id="seeds"></div>
    <div class="controls">
        <div id="shovel-btn" class="btn" title="Pala" onclick="toggleShovel()">🧹</div>
        <div id="speed-btn" class="btn" title="Velocidad" onclick="toggleSpeed()" style="background: #ff5722;">x1</div>
        <div id="pause-btn" class="btn" title="Pausa" onclick="togglePause()">⏸️</div>
    </div>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div id="announcement">¡UNA GRAN HORDA SE APROXIMA!</div>
    <div id="overlay">
        <h1 id="status-text" style="font-size: 50px;"></h1>
        <button style="padding: 20px 50px; font-size: 25px; cursor: pointer; background: #4caf50; color: white; border: none; border-radius: 10px;" onclick="location.reload()">MENÚ PRINCIPAL</button>
    </div>
</div>

<script>
/** @type {HTMLCanvasElement} */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const cellSize = 100;

// Estado del Juego
let resources = 150, frame = 0, gameSpeed = 1, isPaused = false;
let wave = 1, waveProgress = 0, maxWaves = 10;
let gameOver = false, gameWon = false, selectedPlant = null, shovelActive = false;
let mouse = { x: 0, y: 0 };

const plants = [], zombies = [], projectiles = [], suns = [], mowers = [], explosions = [];

const plantTypes = {
    'lanzaguisantes': { cost: 100, hp: 100, color: '#4caf50', cooldown: 300 },
    'girasol': { cost: 50, hp: 80, color: '#ffeb3b', cooldown: 300 },
    'nuez': { cost: 50, hp: 2000, color: '#a1887f', cooldown: 900 },
    'repetidora': { cost: 200, hp: 100, color: '#1b5e20', cooldown: 400, lockWave: 2 },
    'plantorcha': { cost: 175, hp: 200, color: '#ff9800', cooldown: 400, lockWave: 3 },
    'papapum': { cost: 25, hp: 100, color: '#795548', cooldown: 800 },
    'hielaguisantes': { cost: 175, hp: 100, color: '#4fc3f7', cooldown: 500 },
    'petacereza': { cost: 150, hp: 100, color: '#f44336', cooldown: 1800 }
};

let cooldowns = {};
Object.keys(plantTypes).forEach(k => cooldowns[k] = 0);

// --- FUNCIONES DE DIBUJO ---

function drawPlant(c, type, x, y, ready = true) {
    c.save();
    c.translate(x + 50, y + 50);
    c.strokeStyle = '#000';
    c.lineWidth = 2;

    if (type === 'lanzaguisantes' || type === 'repetidora' || type === 'hielaguisantes') {
        // Tallo y hojas base
        c.fillStyle = '#2e7d32';
        c.beginPath(); c.ellipse(-10, 35, 15, 8, 0.5, 0, Math.PI*2); c.fill(); c.stroke();
        c.beginPath(); c.ellipse(10, 35, 15, 8, -0.5, 0, Math.PI*2); c.fill(); c.stroke();
        c.fillRect(-4, 10, 8, 25);
        
        // Cabeza
        c.fillStyle = plantTypes[type].color;
        c.beginPath(); c.arc(0, 0, 25, 0, Math.PI*2); c.fill(); c.stroke();
        
        // Boca (cañón)
        c.beginPath(); c.ellipse(20, 0, 12, 15, 0, 0, Math.PI*2); c.fill(); c.stroke();
        c.fillStyle = '#1b5e20';
        if (type === 'hielaguisantes') c.fillStyle = '#01579b';
        c.beginPath(); c.ellipse(22, 0, 6, 9, 0, 0, Math.PI*2); c.fill();
        
        // Ojos
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(5, -8, 5, 0, Math.PI*2); c.fill();
        c.fillStyle = '#000';
        c.beginPath(); c.arc(7, -8, 2, 0, Math.PI*2); c.fill();

        // Detalle Repetidora (segunda hoja atrás)
        if (type === 'repetidora') {
            c.fillStyle = '#1b5e20';
            c.beginPath(); c.arc(-20, -15, 10, 0, Math.PI*2); c.fill(); c.stroke();
        }
    } 
    else if (type === 'girasol') {
        // Tallo
        c.fillStyle = '#2e7d32';
        c.fillRect(-3, 10, 6, 30);
        // Pétalos
        c.fillStyle = '#ffeb3b';
        for(let i=0; i<8; i++) {
            c.rotate(Math.PI/4);
            c.beginPath(); c.ellipse(0, -22, 10, 15, 0, 0, Math.PI*2); c.fill(); c.stroke();
        }
        // Centro
        c.fillStyle = '#5d4037';
        c.beginPath(); c.arc(0, 0, 18, 0, Math.PI*2); c.fill(); c.stroke();
        // Cara
        c.fillStyle = '#000';
        c.beginPath(); c.arc(-6, -4, 2, 0, Math.PI*2); c.arc(6, -4, 2, 0, Math.PI*2); c.fill();
        c.beginPath(); c.arc(0, 4, 5, 0, Math.PI); c.stroke();
    }
    else if (type === 'nuez') {
        c.fillStyle = '#a1887f';
        c.beginPath(); c.ellipse(0, 5, 30, 40, 0, 0, Math.PI*2); c.fill(); c.stroke();
        // Sombra/Textura
        c.fillStyle = 'rgba(0,0,0,0.1)';
        c.beginPath(); c.ellipse(-10, 5, 15, 30, 0, 0, Math.PI*2); c.fill();
        // Ojos grandes
        c.fillStyle = '#fff';
        c.beginPath(); c.ellipse(-10, -10, 6, 8, 0, 0, Math.PI*2); c.ellipse(10, -10, 6, 8, 0, 0, Math.PI*2); c.fill();
        c.fillStyle = '#000';
        c.beginPath(); c.arc(-8, -8, 2, 0, Math.PI*2); c.arc(12, -8, 2, 0, Math.PI*2); c.fill();
    }
    else if (type === 'plantorcha') {
        c.fillStyle = '#5d4037';
        c.beginPath(); c.moveTo(-25, 40); c.lineTo(-20, -10); c.lineTo(20, -10); c.lineTo(25, 40); c.closePath(); c.fill(); c.stroke();
        // Fuego animado
        const flicker = Math.sin(frame * 0.2) * 5;
        c.fillStyle = '#ff5722';
        c.beginPath(); c.moveTo(-20, -10); c.quadraticCurveTo(0, -60 - flicker, 20, -10); c.fill();
        c.fillStyle = '#ffeb3b';
        c.beginPath(); c.moveTo(-12, -10); c.quadraticCurveTo(0, -40 - flicker, 12, -10); c.fill();
    }
    else if (type === 'papapum') {
        if (!ready) {
            c.fillStyle = '#4e342e';
            c.beginPath(); c.arc(0, 35, 15, 0, Math.PI*2); c.fill(); c.stroke();
        } else {
            c.fillStyle = '#8d6e63';
            c.beginPath(); c.ellipse(0, 25, 25, 18, 0, 0, Math.PI*2); c.fill(); c.stroke();
            c.fillStyle = (frame % 20 < 10) ? '#ff1744' : '#000';
            c.beginPath(); c.arc(0, 0, 6, 0, Math.PI*2); c.fill();
        }
    }
    else if (type === 'petacereza') {
        c.fillStyle = '#d32f2f';
        c.beginPath(); c.arc(-18, 15, 22, 0, Math.PI*2); c.fill(); c.stroke();
        c.beginPath(); c.arc(18, 15, 22, 0, Math.PI*2); c.fill(); c.stroke();
        c.strokeStyle = '#2e7d32'; c.lineWidth = 4;
        c.beginPath(); c.moveTo(-10, -5); c.quadraticCurveTo(0, -35, 10, -5); c.stroke();
    }
    c.restore();
}

function drawZombie(z) {
    ctx.save();
    ctx.translate(z.x + 50, z.y + 50);
    const walk = Math.sin(frame * 0.15);
    ctx.rotate(walk * 0.05);
    
    // Periódico (si tiene)
    if (z.type === 'periodico' && !z.angry) {
        ctx.fillStyle = '#eceff1';
        ctx.fillRect(15, -10, 35, 45);
        ctx.strokeRect(15, -10, 35, 45);
        ctx.fillStyle = '#90a4ae';
        ctx.fillRect(20, 5, 25, 2); ctx.fillRect(20, 15, 25, 2);
    }

    // Cuerpo
    ctx.fillStyle = z.angry ? '#d32f2f' : (z.type === 'periodico' ? '#455a64' : '#5d4037');
    ctx.fillRect(-20, -10, 40, 50);
    ctx.strokeRect(-20, -10, 40, 50);
    
    // Cabeza
    ctx.fillStyle = z.freeze > 0 ? '#4fc3f7' : (z.angry ? '#f44336' : '#7cb342');
    ctx.beginPath(); ctx.arc(0, -30, 22, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    
    // Ojos
    ctx.fillStyle = z.angry ? '#ffeb3b' : '#fff';
    ctx.beginPath(); ctx.arc(8, -35, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(10, -35, 2, 0, Math.PI*2); ctx.fill();

    // Bandera
    if (z.type === 'bandera') {
        ctx.strokeStyle = '#795548'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -70); ctx.stroke();
        ctx.fillStyle = '#f44336'; ctx.fillRect(0, -70, 30, 20); ctx.strokeRect(0, -70, 30, 20);
    }
    ctx.restore();
}

// --- LÓGICA DE CONTROL ---

function startGame(lvl) {
    document.getElementById('menu-container').style.display = 'none';
    document.getElementById('ui-panel').style.display = 'flex';
    document.getElementById('game-container').style.display = 'block';
    updateUI();
    loop();
}

function togglePause() { 
    isPaused = !isPaused; 
    document.getElementById('pause-btn').innerText = isPaused ? "▶️" : "⏸️";
}

function toggleSpeed() {
    gameSpeed = (gameSpeed % 3) + 1;
    document.getElementById('speed-btn').innerText = `x${gameSpeed}`;
}

function toggleShovel() {
    shovelActive = !shovelActive;
    selectedPlant = null;
    document.getElementById('shovel-btn').classList.toggle('active', shovelActive);
    updateUI();
}

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', () => {
    if (isPaused) return;

    // 1. Prioridad: Recoger Soles
    for (let i = suns.length - 1; i >= 0; i--) {
        if (Math.hypot(mouse.x - suns[i].x, mouse.y - suns[i].y) < 50) {
            resources += 25;
            suns.splice(i, 1);
            updateUI();
            return; // No hacer nada más si recogió un sol
        }
    }

    const gx = Math.floor(mouse.x/100)*100;
    const gy = Math.floor(mouse.y/100)*100;

    // 2. Pala
    if (shovelActive) {
        const idx = plants.findIndex(p => p.x === gx && p.y === gy);
        if (idx !== -1) {
            plants.splice(idx, 1);
            shovelActive = false;
            document.getElementById('shovel-btn').classList.remove('active');
            updateUI();
        }
        return;
    }

    // 3. Colocar Planta
    if (selectedPlant && gx < 900) {
        const pData = plantTypes[selectedPlant];
        if (resources >= pData.cost && !plants.some(p => p.x === gx && p.y === gy)) {
            if (selectedPlant === 'petacereza') {
                explosions.push({x: gx+50, y: gy+50, r: 160, t: 15});
                zombies.forEach(z => { if(Math.abs(z.x-gx)<180 && Math.abs(z.y-gy)<180) z.hp=0; });
            } else {
                plants.push({ x: gx, y: gy, type: selectedPlant, hp: pData.hp, t: 0, ready: (selectedPlant !== 'papapum'), ráfaga: 0 });
            }
            resources -= pData.cost;
            cooldowns[selectedPlant] = pData.cooldown;
            selectedPlant = null;
            updateUI();
        }
    }
});

// --- LÓGICA DEL JUEGO ---

function spawnZombie(count, type = 'basico') {
    for (let i = 0; i < count; i++) {
        const hp = (100 + (wave * 40)) * (type === 'periodico' ? 0.7 : 1);
        zombies.push({
            x: 900 + (i * 45), y: Math.floor(Math.random()*6)*cellSize,
            hp: hp, maxHp: hp, type: type,
            speed: type === 'periodico' ? 0.25 : 0.35,
            angry: false, eatSpeed: 1, freeze: 0
        });
    }
}

function triggerHorde() {
    const ann = document.getElementById('announcement');
    ann.style.display = 'block';
    setTimeout(() => ann.style.display = 'none', 3000);
    
    // Zombie bandera + horda (6 * oleada)
    zombies.push({x: 900, y: Math.floor(Math.random()*6)*cellSize, hp: 150, type: 'bandera', speed: 0.5, freeze: 0});
    spawnZombie(wave * 6);
    if(wave >= 2) spawnZombie(wave, 'periodico');
}

function loop() {
    if (!isPaused && !gameOver && !gameWon) {
        for (let s = 0; s < gameSpeed; s++) {
            frame++;
            
            // Cooldowns
            Object.keys(cooldowns).forEach(k => { if(cooldowns[k] > 0) cooldowns[k]--; });

            // Progreso de Oleada
            if (frame % 200 === 0 && waveProgress < 100) {
                waveProgress += 4;
                if (Math.random() > 0.8) spawnZombie(1);
                if (waveProgress >= 100) triggerHorde();
            }

            // Siguiente Oleada
            if (waveProgress >= 100 && zombies.length === 0 && wave < maxWaves) {
                wave++;
                waveProgress = 0;
                updateUI();
            }

            // Soles del cielo
            if (frame % 450 === 0) suns.push({x: Math.random()*800+50, y: 0, targetY: Math.random()*400+100, t: 600});

            // Plantas
            plants.forEach(p => {
                p.t++;
                if (p.type === 'girasol' && p.t % 600 === 0) suns.push({x: p.x+20, y: p.y+20, targetY: p.y+20, t: 600});
                
                if (['lanzaguisantes', 'repetidora', 'hielaguisantes'].includes(p.type) && p.t % 100 === 0) {
                    if (zombies.some(z => z.y === p.y && z.x > p.x)) {
                        projectiles.push({x: p.x+80, y: p.y+35, fire: false, ice: (p.type === 'hielaguisantes')});
                        if (p.type === 'repetidora') p.ráfaga = 15;
                    }
                }
                if (p.ráfaga > 0) {
                    p.ráfaga--;
                    if(p.ráfaga === 0) projectiles.push({x: p.x+80, y: p.y+35, fire: false, ice: false});
                }
                if (p.type === 'papapum' && !p.ready && p.t > 400) p.ready = true;
            });

            // Proyectiles
            projectiles.forEach((pr, i) => {
                pr.x += 8;
                // Efecto Plantorcha
                plants.filter(pl => pl.type === 'plantorcha').forEach(torch => {
                    if (pr.x > torch.x && pr.x < torch.x + 60 && pr.y > torch.y && pr.y < torch.y + 100) {
                        if (pr.ice) pr.ice = false; // Quita hielo
                        else pr.fire = true; // Convierte en fuego
                    }
                });

                zombies.forEach(z => {
                    if (pr.x > z.x && pr.x < z.x+70 && pr.y > z.y && pr.y < z.y+100) {
                        z.hp -= pr.fire ? 45 : 20;
                        if (pr.ice) z.freeze = 150;
                        if (pr.fire) z.freeze = 0;
                        projectiles.splice(i, 1);
                    }
                });
                if (pr.x > 920) projectiles.splice(i, 1);
            });

            // Zombies
            zombies.forEach((z, i) => {
                if (z.type === 'periodico' && !z.angry && z.hp < z.maxHp * 0.7) {
                    z.angry = true; z.speed *= 3; z.eatSpeed = 4;
                }
                let eating = false;
                plants.forEach(p => {
                    if (z.y === p.y && z.x < p.x + 60 && z.x > p.x - 20) {
                        eating = true;
                        p.hp -= z.eatSpeed;
                        if(p.type === 'papapum' && p.ready) { z.hp = 0; p.hp = 0; explosions.push({x:p.x+50,y:p.y+50,r:120,t:10}); }
                    }
                });
                if (!eating) z.x -= (z.freeze > 0 ? z.speed*0.5 : z.speed);
                if (z.x < -60) gameOver = true;
                if (z.hp <= 0) zombies.splice(i, 1);
                if (z.freeze > 0) z.freeze--;
            });

            // Podadoras
            mowers.forEach((m, i) => {
                if (m.active) {
                    m.x += 10;
                    zombies.forEach(z => { if(z.y === m.y && Math.abs(z.x-m.x)<40) z.hp=0; });
                    if (m.x > 900) mowers.splice(i, 1);
                } else if (zombies.some(z => z.y === m.y && z.x < 40)) m.active = true;
            });

            suns.forEach((s, i) => { if(s.y < s.targetY) s.y += 2; s.t--; if(s.t <= 0) suns.splice(i, 1); });
            explosions.forEach((ex, i) => { ex.t--; if(ex.t <= 0) explosions.splice(i, 1); });
            plants.forEach((p, i) => { if(p.hp <= 0) plants.splice(i, 1); });

            if (wave === maxWaves && waveProgress >= 100 && zombies.length === 0) gameWon = true;
        }
    }

    // --- DIBUJADO FINAL ---
    ctx.clearRect(0,0,900,600);
    // Césped
    for(let i=0; i<9; i++) for(let j=0; j<6; j++) {
        ctx.fillStyle = (i+j)%2==0 ? '#4caf50' : '#43a047';
        ctx.fillRect(i*100, j*100, 100, 100);
    }
    // Objetos
    mowers.forEach(m => { ctx.fillStyle = '#c62828'; ctx.fillRect(m.x, m.y+30, 60, 40); });
    plants.forEach(p => drawPlant(ctx, p.type, p.x, p.y, p.ready));
    zombies.forEach(z => drawZombie(z));
    projectiles.forEach(pr => {
        ctx.fillStyle = pr.fire ? '#ff5722' : (pr.ice ? '#4fc3f7' : '#76ff03');
        ctx.beginPath(); ctx.arc(pr.x, pr.y, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    });
    suns.forEach(s => {
        ctx.fillStyle = '#fff176'; ctx.beginPath(); ctx.arc(s.x, s.y, 22, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    });
    explosions.forEach(ex => {
        ctx.fillStyle = 'rgba(255,100,0,0.6)';
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2); ctx.fill();
    });

    if (gameOver) { document.getElementById('status-text').innerText = "¡LOS ZOMBIES COMIERON TUS CEREBROS!"; document.getElementById('overlay').style.display = 'flex'; return; }
    if (gameWon) { document.getElementById('status-text').innerText = "¡NIVEL COMPLETADO!"; document.getElementById('overlay').style.display = 'flex'; return; }

    requestAnimationFrame(loop);
}

function updateUI() {
    const container = document.getElementById('seeds');
    container.innerHTML = '';
    Object.keys(plantTypes).forEach(key => {
        const p = plantTypes[key];
        const isLocked = p.lockWave && wave < p.lockWave;
        const div = document.createElement('div');
        div.className = `seed ${isLocked ? 'locked' : (resources < p.cost || cooldowns[key] > 0 ? 'disabled' : '')} ${selectedPlant === key ? 'selected' : ''}`;
        
        if (isLocked) {
            div.innerHTML = `OLA ${p.lockWave}`;
        } else {
            const canvasSeed = document.createElement('canvas');
            canvasSeed.width = 65; canvasSeed.height = 65;
            drawPlant(canvasSeed.getContext('2d'), key, -17, -17);
            div.appendChild(canvasSeed);
            div.innerHTML += `<span>${p.cost}</span><div class="cooldown-overlay" style="height: ${(cooldowns[key]/p.cooldown)*100}%"></div>`;
            div.onclick = () => {
                if (resources >= p.cost && cooldowns[key] <= 0) {
                    selectedPlant = key;
                    shovelActive = false;
                    document.getElementById('shovel-btn').classList.remove('active');
                    updateUI();
                }
            };
        }
        container.appendChild(div);
    });
    document.getElementById('sun-counter').innerText = `☀️ ${resources}`;
}

// Inicializar cortadoras de césped
for (let i = 0; i < 6; i++) mowers.push({x: 10, y: i * cellSize, active: false});
</script>
