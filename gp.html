<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PvZ: Multi-Level Edition</title>
    <style>
        body { background: #121212; color: white; font-family: 'Arial Black', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; user-select: none; }
        
        /* Menu Styles */
        #menu-container { position: absolute; width: 100%; height: 100%; background: #2e7d32; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 10px solid #1b5e20; box-sizing: border-box; }
        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .level-btn { width: 150px; height: 100px; background: #795548; border: 5px solid #3e2723; color: white; font-size: 20px; cursor: pointer; border-radius: 10px; }
        .level-btn.locked { background: #333; border-color: #000; cursor: not-allowed; opacity: 0.6; }
        .level-btn:not(.locked):hover { background: #a1887f; transform: scale(1.05); }

        /* Game UI */
        #ui-panel { width: 1000px; height: 110px; background: #4d3a29; display: none; align-items: center; padding: 0 15px; box-sizing: border-box; border-bottom: 5px solid #241a12; gap: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #sun-counter { background: #ffd54f; color: #332; padding: 8px; border-radius: 10px; font-weight: bold; font-size: 22px; border: 4px solid #f57f17; min-width: 85px; text-align: center; }
        .seed-packets { display: flex; gap: 5px; }
        .seed { width: 75px; height: 95px; background: #795548; border: 3px solid #3e2723; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; border-radius: 5px; overflow: hidden; }
        .seed.selected { border-color: #fff; background: #a1887f; box-shadow: 0 0 15px #fff; }
        .seed.disabled { opacity: 0.5; filter: grayscale(1); }
        .seed.locked { background: #222; font-size: 10px; text-align: center; justify-content: center; }
        .seed .cooldown-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0,0,0,0.7); pointer-events: none; }
        
        .control-btn { padding: 10px; border-radius: 8px; cursor: pointer; border: 3px solid #37474f; font-size: 20px; display: flex; align-items: center; justify-content: center; min-width: 55px; background: #607d8b; }
        .control-btn.active { border-color: white; background: #cfd8dc; }

        #game-container { position: relative; width: 900px; height: 600px; margin-top: 15px; border: 8px solid #3e2723; border-radius: 15px; display: none; }
        #announcement { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ffeb3b; font-size: 40px; text-shadow: 4px 4px #000; display: none; z-index: 50; width: 100%; text-align: center; pointer-events: none;}
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

<div id="menu-container">
    <h1 style="font-size: 60px; text-shadow: 5px 5px #000;">PLANTAS VS ZOMBIES</h1>
    <div class="level-grid">
        <button class="level-btn" onclick="startGame(1)">NIVEL 1</button>
        <button class="level-btn locked">NIVEL 2<br>🔒</button>
        <button class="level-btn locked">NIVEL 3<br>🔒</button>
        <button class="level-btn locked">NIVEL 4<br>🔒</button>
    </div>
</div>

<div id="ui-panel">
    <div id="sun-counter">☀️ 150</div>
    <div class="seed-packets" id="seeds"></div>
    <div id="shovel" class="control-btn" onclick="toggleShovel()">🧹</div>
    <div id="speed-btn" class="control-btn" onclick="toggleSpeed()" style="background: #ff5722;">x1</div>
    <div id="pause-btn" class="control-btn" onclick="togglePause()">⏸️</div>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div id="announcement">¡SE ACERCA UNA GRAN HORDA!</div>
    <div id="overlay">
        <h1 id="status-text" style="font-size: 40px;"></h1>
        <button style="padding: 15px; cursor: pointer;" onclick="location.reload()">VOLVER AL MENÚ</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const cellSize = 100;

let resources = 150, frame = 0, gameSpeed = 1, isPaused = false, currentLevel = 1;
let wave = 1, waveProgress = 0, maxWaves = 10;
let gameOver = false, gameWon = false, selectedPlant = null, shovelActive = false;
let mouse = { x: 0, y: 0 };

const plants = [], zombies = [], projectiles = [], suns = [], mowers = [], explosions = [];

const plantTypes = {
    'lanzaguisantes': { cost: 100, hp: 100, color: '#4caf50', cooldown: 300 },
    'girasol': { cost: 50, hp: 80, color: '#ffeb3b', cooldown: 300 },
    'nuez': { cost: 50, hp: 2000, color: '#a1887f', cooldown: 900 },
    'repetidora': { cost: 200, hp: 100, color: '#1b5e20', cooldown: 400, lockWave: 2 },
    'plantorcha': { cost: 175, hp: 150, color: '#ff9800', cooldown: 400, lockWave: 3 },
    'hielaguisantes': { cost: 175, hp: 100, color: '#4fc3f7', cooldown: 500 },
    'papapum': { cost: 25, hp: 100, color: '#795548', cooldown: 800 },
    'petacereza': { cost: 150, hp: 100, color: '#f44336', cooldown: 1800 }
};

let cooldowns = {};
Object.keys(plantTypes).forEach(k => cooldowns[k] = 0);

function startGame(lvl) {
    currentLevel = lvl;
    document.getElementById('menu-container').style.display = 'none';
    document.getElementById('ui-panel').style.display = 'flex';
    document.getElementById('game-container').style.display = 'block';
    updateUI();
    loop();
}

function togglePause() { 
    isPaused = !isPaused; 
    document.getElementById('pause-btn').innerText = isPaused ? "▶️" : "⏸️";
}

function toggleSpeed() {
    gameSpeed = (gameSpeed % 3) + 1;
    document.getElementById('speed-btn').innerText = `x${gameSpeed}`;
}

function toggleShovel() {
    shovelActive = !shovelActive;
    selectedPlant = null;
    document.getElementById('shovel').classList.toggle('active', shovelActive);
    updateUI();
}

// Eventos de Mouse
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', () => {
    if (isPaused) return;

    // Recoger Soles
    for (let i = suns.length - 1; i >= 0; i--) {
        if (Math.hypot(mouse.x - suns[i].x, mouse.y - suns[i].y) < 50) {
            resources += 25;
            suns.splice(i, 1);
            updateUI();
            return;
        }
    }

    const gx = Math.floor(mouse.x/100)*100, gy = Math.floor(mouse.y/100)*100;
    
    if (shovelActive) {
        const idx = plants.findIndex(p => p.x === gx && p.y === gy);
        if (idx !== -1) plants.splice(idx, 1);
        shovelActive = false;
        document.getElementById('shovel').classList.remove('active');
        updateUI();
        return;
    }

    if (selectedPlant && gx < 900) {
        const cost = plantTypes[selectedPlant].cost;
        if (resources >= cost && !plants.some(p => p.x === gx && p.y === gy)) {
            if (selectedPlant === 'petacereza') {
                explosions.push({x: gx+50, y: gy+50, r: 160, t: 15});
                zombies.forEach(z => { if (Math.abs(z.x - gx) < 180 && Math.abs(z.y - gy) < 180) z.hp = 0; });
            } else {
                plants.push({ x: gx, y: gy, type: selectedPlant, hp: plantTypes[selectedPlant].hp, t: 0, ready: (selectedPlant !== 'papapum'), ráfaga: 0 });
            }
            resources -= cost;
            cooldowns[selectedPlant] = plantTypes[selectedPlant].cooldown;
            selectedPlant = null;
            updateUI();
        }
    }
});

function updateUI() {
    const container = document.getElementById('seeds');
    container.innerHTML = '';
    Object.keys(plantTypes).forEach(key => {
        const p = plantTypes[key];
        const isLocked = p.lockWave && wave < p.lockWave;
        const div = document.createElement('div');
        div.className = `seed ${isLocked ? 'locked' : (resources < p.cost || cooldowns[key] > 0 ? 'disabled' : '')} ${selectedPlant === key ? 'selected' : ''}`;
        
        if(isLocked) {
            div.innerHTML = `BLOQUEADO<br>OLA ${p.lockWave}`;
        } else {
            div.innerHTML = `<span style="font-size:10px">${key.toUpperCase()}</span><span>${p.cost}</span><div class="cooldown-overlay" style="height: ${(cooldowns[key]/p.cooldown)*100}%"></div>`;
            div.onclick = (e) => {
                e.stopPropagation();
                if (resources >= p.cost && cooldowns[key] <= 0) {
                    selectedPlant = key;
                    shovelActive = false;
                    document.getElementById('shovel').classList.remove('active');
                    updateUI();
                }
            };
        }
        container.appendChild(div);
    });
    document.getElementById('sun-counter').innerText = `☀️ ${resources}`;
}

// Funciones de dibujo simplificadas para el rendimiento
function drawPlant(c, type, x, y) {
    c.fillStyle = plantTypes[type].color;
    c.beginPath(); c.arc(x+50, y+50, 30, 0, Math.PI*2); c.fill();
    c.strokeStyle = "black"; c.stroke();
    if(type === 'plantorcha') { c.fillStyle = "orange"; c.fillRect(x+40, y+20, 20, 30); }
}

function spawnZombie(count, type = 'basico') {
    for (let i = 0; i < count; i++) {
        zombies.push({
            x: 900 + (i * 40), y: Math.floor(Math.random()*6)*cellSize, 
            hp: 100 + (wave * 50), maxHp: 100 + (wave * 50), 
            speed: type === 'periodico' ? 0.25 : 0.35, 
            type: type, angry: false, eatSpeed: 1
        });
    }
}

function triggerHorde() {
    document.getElementById('announcement').style.display = 'block';
    setTimeout(() => document.getElementById('announcement').style.display = 'none', 3000);
    spawnZombie(wave * 6);
    // Añadir periódicos en hordas a partir de ola 2
    if(wave >= 2) spawnZombie(wave, 'periodico');
}

function loop() {
    if (gameOver || gameWon || isPaused) {
        if(!isPaused) return; 
    } else {
        for (let s = 0; s < gameSpeed; s++) {
            frame++;
            Object.keys(cooldowns).forEach(k => { if (cooldowns[k] > 0) cooldowns[k]--; });

            if (frame % 200 === 0 && waveProgress < 100) {
                waveProgress += 5;
                if (Math.random() > 0.8) spawnZombie(1);
                if (waveProgress >= 100) triggerHorde();
            }

            if (waveProgress >= 100 && zombies.length === 0 && wave < maxWaves) {
                wave++; waveProgress = 0; updateUI();
            }

            if (frame % 400 === 0) suns.push({x: Math.random()*800+50, y: 0, targetY: Math.random()*400+100, t: 500});

            // Lógica de Proyectiles y Plantas
            projectiles.forEach((pr, i) => {
                pr.x += 7;
                plants.filter(p => p.type === 'plantorcha').forEach(pl => {
                    if (pr.x > pl.x && pr.x < pl.x + 50 && pr.y > pl.y && pr.y < pl.y + 100) pr.fire = true;
                });
                zombies.forEach(z => {
                    if (pr.x > z.x && pr.x < z.x+60 && pr.y > z.y && pr.y < z.y+100) {
                        z.hp -= pr.fire ? 40 : 20;
                        projectiles.splice(i, 1);
                    }
                });
            });

            plants.forEach(p => {
                p.t++;
                if (p.type === 'girasol' && p.t % 600 === 0) suns.push({x: p.x+20, y: p.y+20, targetY: p.y+20, t: 500});
                if (['lanzaguisantes', 'repetidora'].includes(p.type) && p.t % 100 === 0) {
                    if (zombies.some(z => z.y === p.y && z.x > p.x)) {
                        projectiles.push({x: p.x+80, y: p.y+35, fire: false});
                        if(p.type === 'repetidora') p.t += 80; // Dispara doble
                    }
                }
            });

            zombies.forEach((z, i) => {
                if (z.type === 'periodico' && !z.angry && z.hp < z.maxHp * 0.7) {
                    z.angry = true; z.speed *= 3; z.eatSpeed = 3;
                }
                let eating = false;
                plants.forEach(p => {
                    if (z.y === p.y && z.x < p.x + 50 && z.x > p.x - 20) {
                        eating = true; p.hp -= z.eatSpeed;
                    }
                });
                if (!eating) z.x -= z.speed;
                if (z.x < -50) gameOver = true;
                if (z.hp <= 0) zombies.splice(i, 1);
            });
            
            suns.forEach((s, i) => { if (s.y < s.targetY) s.y += 2; s.t--; if (s.t <= 0) suns.splice(i, 1); });
            plants.forEach((p, i) => { if (p.hp <= 0) plants.splice(i, 1); });
        }
    }

    // Dibujado
    ctx.clearRect(0,0,900,600);
    for(let i=0; i<9; i++) for(let j=0; j<6; j++) {
        ctx.fillStyle = (i+j)%2==0 ? '#4caf50' : '#43a047';
        ctx.fillRect(i*100, j*100, 100, 100);
    }
    plants.forEach(p => drawPlant(ctx, p.type, p.x, p.y));
    zombies.forEach(z => {
        ctx.fillStyle = z.angry ? "red" : (z.type === 'periodico' ? "gray" : "#7cb342");
        ctx.fillRect(z.x+20, z.y+20, 50, 70);
    });
    projectiles.forEach(pr => {
        ctx.fillStyle = pr.fire ? "orange" : "lightgreen";
        ctx.beginPath(); ctx.arc(pr.x, pr.y, 10, 0, Math.PI*2); ctx.fill();
    });
    suns.forEach(s => {
        ctx.fillStyle = "yellow";
        ctx.beginPath(); ctx.arc(s.x, s.y, 20, 0, Math.PI*2); ctx.fill();
    });

    if (gameOver) { document.getElementById('status-text').innerText = "¡PERDISTE!"; document.getElementById('overlay').style.display = 'flex'; return; }
    if (gameWon) { document.getElementById('status-text').innerText = "¡NIVEL COMPLETADO!"; document.getElementById('overlay').style.display = 'flex'; return; }
    
    requestAnimationFrame(loop);
}

for (let i = 0; i < 6; i++) mowers.push({x: 10, y: i * cellSize, active: false});
</script>
</body>
</html>
