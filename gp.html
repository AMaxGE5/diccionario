<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PvZ: Extreme Speed - Miner Update</title>
    <style>
        body { background: #121212; color: white; font-family: 'Arial Black', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; user-select: none; }
        #menu-container { position: absolute; width: 100%; height: 100%; background: #2e7d32; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 10px solid #1b5e20; box-sizing: border-box; }
        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .level-btn { width: 160px; height: 110px; background: #795548; border: 5px solid #3e2723; color: white; font-size: 22px; cursor: pointer; border-radius: 12px; font-family: 'Arial Black'; }
        #seed-selection-screen { position: absolute; width: 100%; height: 100%; background: #241a12; z-index: 150; display: none; flex-direction: column; align-items: center; justify-content: center; border: 10px solid #3e2723; box-sizing: border-box; text-align: center; }
        .slot-container { display: flex; gap: 8px; background: #3e2723; padding: 15px; border-radius: 10px; border: 4px solid #795548; margin-bottom: 20px; min-height: 100px; min-width: 615px; justify-content: center; }
        .pool-container { display: flex; gap: 10px; flex-wrap: wrap; background: #4d3a29; padding: 20px; border-radius: 10px; border: 4px solid #3e2723; width: 800px; justify-content: center; margin-bottom: 20px; }
        .seed-empty-slot { width: 75px; height: 95px; background: #1a120c; border: 3px dashed #5d4037; border-radius: 5px; box-sizing: border-box; }
        #ui-panel { width: 1000px; height: 110px; background: #4d3a29; display: none; align-items: center; padding: 0 15px; box-sizing: border-box; border-bottom: 5px solid #241a12; gap: 8px; }
        #sun-counter { background: #ffd54f; color: #332; padding: 8px; border-radius: 10px; font-weight: bold; font-size: 22px; border: 4px solid #f57f17; min-width: 85px; text-align: center; }
        .seed-packets { display: flex; gap: 5px; }
        .seed { width: 75px; height: 95px; background: #795548; border: 3px solid #3e2723; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; border-radius: 5px; overflow: hidden; box-sizing: border-box; }
        .seed.selected { border-color: #fff; background: #a1887f; box-shadow: 0 0 15px #fff; }
        .seed.disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
        .seed .cooldown-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0,0,0,0.7); pointer-events: none; }
        .seed span { font-size: 11px; z-index: 2; font-weight: bold; text-shadow: 1px 1px #000; margin-top: 2px; }
        .control-btn { padding: 10px; border-radius: 8px; cursor: pointer; border: 3px solid #37474f; font-size: 20px; display: flex; align-items: center; justify-content: center; min-width: 55px; }
        .action-btn { padding: 15px 40px; font-size: 24px; cursor: pointer; background: #4caf50; color: white; border: 4px solid #1b5e20; border-radius: 10px; font-family: 'Arial Black'; }
        #game-container { position: relative; width: 900px; height: 600px; margin-top: 15px; border: 8px solid #3e2723; border-radius: 15px; display: none; }
        canvas { display: block; }
        #announcement { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ffeb3b; font-size: 40px; text-shadow: 4px 4px #000; display: none; z-index: 50; text-align: center; width: 100%; }
        #wave-panel { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; width: 200px; border: 2px solid #ffeb3b; }
        #wave-bar { height: 12px; background: #f44336; width: 0%; border-radius: 5px; transition: width 0.3s; }
        #overlay, #pause-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
    </style>
</head>
<body>

<div id="menu-container">
    <h1>SELECCIONAR NIVEL</h1>
    <div class="level-grid">
        <button class="level-btn" onclick="prepareLevel(1)">NIVEL 1<br>☀️</button>
        <button class="level-btn" onclick="prepareLevel(2)">NIVEL 2<br>🌙</button>
    </div>
</div>

<div id="seed-selection-screen">
    <h1>ELIGE TUS PLANTAS</h1>
    <div class="slot-container" id="chosen-seeds-container"></div>
    <div class="pool-container" id="available-seeds-container"></div>
    <button class="action-btn" id="start-level-btn" onclick="startLevel()" disabled>LISTO</button>
</div>

<div id="ui-panel">
    <div id="sun-counter">☀️ 150</div>
    <div class="seed-packets" id="seeds"></div>
    <div id="shovel" class="control-btn">🧹</div>
    <div id="speed-btn" class="control-btn">x1</div>
    <div id="pause-btn" class="control-btn">⏸️</div>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div id="announcement"></div>
    <div id="wave-panel">
        <div style="font-size: 12px; color: #ffeb3b; margin-bottom: 5px;" id="wave-text">OLEADA 1</div>
        <div style="background: #222; border-radius: 6px;"><div id="wave-bar"></div></div>
    </div>
    <div id="pause-overlay"><h1>PAUSA</h1><button class="action-btn" onclick="togglePause()">VOLVER</button></div>
    <div id="overlay"><h1 id="status-text"></h1><button class="action-btn" onclick="location.reload()">REINTENTAR</button></div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const cellSize = 100;

let currentLevel = 1, isNight = false, resources = 150, frame = 0, gameSpeed = 1, wave = 1, waveProgress = 0;
let gameOver = false, isPaused = false, selectedPlant = null, shovelActive = false;
let plants = [], zombies = [], projectiles = [], suns = [], mowers = [], explosions = [];

const plantTypes = {
    'lanzaguisantes': { cost: 100, hp: 100, color: '#4caf50', cooldown: 300, time: 'diurna' },
    'girasol': { cost: 50, hp: 80, color: '#ffeb3b', cooldown: 300, time: 'diurna' },
    'nuez': { cost: 50, hp: 2000, color: '#a1887f', cooldown: 900, time: 'diurna' },
    'bipetidora': { cost: 175, hp: 120, color: '#8bc34a', cooldown: 350, time: 'diurna' },
    'setasolar': { cost: 25, hp: 80, color: '#fff59d', cooldown: 300, time: 'nocturna' },
    'setadesesporada': { cost: 0, hp: 50, color: '#9c27b0', cooldown: 150, time: 'nocturna' },
    'papapum': { cost: 25, hp: 100, color: '#795548', cooldown: 800, time: 'diurna' }
};

let cooldowns = {};
let playerDeck = [];
const MAX_DECK_SIZE = 7;

function drawPlant(c, type, x, y, size, angle = 0, sleeping = false) {
    c.save();
    c.translate(x + size/2, y + size/2);
    c.rotate(angle);
    c.strokeStyle = '#000'; c.lineWidth = 3;
    
    if (type === 'lanzaguisantes' || type === 'bipetidora') {
        c.fillStyle = plantTypes[type].color;
        // Cabeza principal
        c.beginPath(); c.arc(10, -10, 20, 0, Math.PI*2); c.fill(); c.stroke();
        c.beginPath(); c.arc(30, -10, 10, 0, Math.PI*2); c.fill(); c.stroke();
        if (type === 'bipetidora') {
            // Cabeza trasera
            c.fillStyle = '#689f38';
            c.beginPath(); c.arc(-15, -5, 18, 0, Math.PI*2); c.fill(); c.stroke();
            c.beginPath(); c.arc(-35, -5, 9, 0, Math.PI*2); c.fill(); c.stroke();
        }
    } else if (type === 'girasol') {
        c.fillStyle = '#fbc02d';
        for(let i=0; i<8; i++){ c.rotate(Math.PI/4); c.beginPath(); c.ellipse(0, -20, 8, 15, 0, 0, Math.PI*2); c.fill(); c.stroke(); }
        c.fillStyle = '#5d4037'; c.beginPath(); c.arc(0,0,15,0,Math.PI*2); c.fill(); c.stroke();
    } else if (type === 'nuez') {
        c.fillStyle = '#8d6e63'; c.beginPath(); c.ellipse(0, 5, 30, 40, 0, 0, Math.PI*2); c.fill(); c.stroke();
    } else if (type === 'papapum') {
        c.fillStyle = '#8d6e63'; c.beginPath(); c.ellipse(0, 25, 25, 15, 0, 0, Math.PI*2); c.fill(); c.stroke();
        c.fillStyle = '#f44336'; c.beginPath(); c.arc(0, 5, 5, 0, Math.PI*2); c.fill();
    } else if (type.includes('seta')) {
        c.fillStyle = '#4e342e'; c.fillRect(-5, 10, 10, 25);
        c.fillStyle = plantTypes[type].color; c.beginPath(); c.ellipse(0, 10, 20, 15, 0, Math.PI, 0); c.fill(); c.stroke();
    }
    
    if (sleeping) {
        c.fillStyle = "white"; c.font = "12px Arial"; c.fillText("Zzz", 10, -20);
    }
    c.restore();
}

function drawZombie(z) {
    ctx.save(); ctx.translate(z.x + 50, z.y + 50);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    
    if (z.type === 'miner' && z.digging) {
        ctx.fillStyle = '#5d4037'; ctx.beginPath(); ctx.arc(0, 40, 30, Math.PI, 0); ctx.fill(); // Montículo de tierra
        ctx.fillStyle = '#7cb342'; ctx.beginPath(); ctx.arc(0, 25, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke(); // Cabeza asomando
    } else {
        ctx.fillStyle = (z.type === 'invocador') ? '#4a148c' : '#5d4037';
        ctx.fillRect(-20, -15, 40, 50); ctx.strokeRect(-20, -15, 40, 50);
        ctx.fillStyle = '#7cb342'; ctx.beginPath(); ctx.arc(0, -30, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        if (z.type === 'miner') { ctx.fillStyle = '#fdd835'; ctx.fillRect(-15, -50, 30, 10); } // Casco
    }
    ctx.restore();
}

function prepareLevel(l) {
    currentLevel = l; document.getElementById('menu-container').style.display = 'none';
    document.getElementById('seed-selection-screen').style.display = 'flex';
    playerDeck = []; renderSelection();
}

function renderSelection() {
    const chosen = document.getElementById('chosen-seeds-container');
    const pool = document.getElementById('available-seeds-container');
    chosen.innerHTML = ''; pool.innerHTML = '';
    
    for(let i=0; i<MAX_DECK_SIZE; i++) {
        const div = document.createElement('div'); div.className = playerDeck[i] ? 'seed' : 'seed-empty-slot';
        if(playerDeck[i]) {
            div.innerHTML = `<span>${plantTypes[playerDeck[i]].cost}</span>`;
            div.onclick = () => { playerDeck.splice(i, 1); renderSelection(); };
        }
        chosen.appendChild(div);
    }
    
    Object.keys(plantTypes).forEach(k => {
        if (!playerDeck.includes(k)) {
            const div = document.createElement('div'); div.className = 'seed';
            div.innerHTML = `<span>${plantTypes[k].cost}</span>`;
            div.onclick = () => { if(playerDeck.length < MAX_DECK_SIZE) { playerDeck.push(k); renderSelection(); } };
            pool.appendChild(div);
        }
    });
    document.getElementById('start-level-btn').disabled = playerDeck.length === 0;
}

function spawnZombie(count, fixedY = null) {
    // Incremento de vida del 10% según pedido
    let baseHp = (100 + (wave * 25)) * 1.1;
    
    for (let i = 0; i < count; i++) {
        let type = 'normal';
        if (wave >= 4 && Math.random() < 0.2) type = 'miner';
        if (wave >= 6 && Math.random() < 0.15) type = 'invocador';
        
        let y = (fixedY !== null) ? fixedY : Math.floor(Math.random()*6)*cellSize;
        zombies.push({
            x: 950 + (i * 30), y: y, 
            hp: baseHp * (type === 'invocador' ? 1.5 : 1), 
            speed: 0.35, type: type, 
            digging: (type === 'miner'), 
            summonT: 0
        });
    }
}

function startLevel() {
    document.getElementById('seed-selection-screen').style.display = 'none';
    document.getElementById('ui-panel').style.display = 'flex';
    document.getElementById('game-container').style.display = 'block';
    for(let i=0; i<6; i++) mowers.push({x: 10, y: i*cellSize, active: false});
    playerDeck.forEach(k => cooldowns[k] = 0);
    loop();
}

function loop() {
    if (!isPaused && !gameOver) {
        for (let s = 0; s < gameSpeed; s++) {
            frame++;
            // Lógica de Oleadas con incrementos de spawneo 30%, 60% y Final
            if (frame % 300 === 0 && waveProgress < 100) {
                waveProgress += 4;
                let multiplier = 1;
                if (wave >= 10) multiplier = 3; // Final: Muchos más
                else if (wave >= 8) multiplier = 1.6; // +60%
                else if (wave >= 3) multiplier = 1.3; // +30%
                
                if (Math.random() < 0.3 * multiplier) spawnZombie(1);
            }

            if (waveProgress >= 100 && zombies.length === 0 && wave < 10) {
                wave++; waveProgress = 0;
                if (currentLevel === 2 && wave === 6) isNight = true;
                spawnZombie(wave);
            }

            // Girasol 25% más lento (600 -> 800)
            plants.forEach(p => {
                p.t++;
                let sunInterval = (p.type === 'girasol' || p.type === 'setasolar') ? 800 : 0;
                if (sunInterval > 0 && p.t % sunInterval === 0 && !p.sleeping) {
                    suns.push({x: p.x+20, y: p.y+20, targetY: p.y+20, t: 500});
                }
                
                // Solo disparan si hay zombies en pantalla
                let zombiesInGarden = zombies.some(z => z.x < 900);
                if (zombiesInGarden && !p.sleeping) {
                    if (p.type === 'lanzaguisantes' && p.t % 100 === 0) {
                        projectiles.push({x: p.x+70, y: p.y+35, vx: 7});
                    }
                    if (p.type === 'bipetidora' && p.t % 100 === 0) {
                        projectiles.push({x: p.x+70, y: p.y+35, vx: 7}); // Adelante
                        projectiles.push({x: p.x+10, y: p.y+45, vx: -7}); // Atrás 1
                        projectiles.push({x: p.x+10, y: p.y+25, vx: -7}); // Atrás 2
                    }
                }
            });

            zombies.forEach((z, idx) => {
                if (z.type === 'invocador') {
                    z.summonT++;
                    if (z.summonT % 400 === 0) spawnZombie(1, z.y);
                }

                if (z.type === 'miner' && z.digging) {
                    z.x -= z.speed * 3;
                    if (z.x < 20) z.digging = false;
                } else {
                    let eating = false;
                    let direction = (z.type === 'miner' && !z.digging) ? 1 : -1;
                    
                    plants.forEach(p => {
                        if (z.y === p.y && Math.abs(z.x - p.x) < 30) {
                            eating = true; p.hp -= 1;
                        }
                    });
                    
                    if (!eating) z.x += z.speed * direction;
                    if (z.x < -50 || z.x > 950) gameOver = true;
                }
            });

            projectiles.forEach((pr, pi) => {
                pr.x += pr.vx;
                zombies.forEach(z => {
                    if (!z.digging && z.y === (pr.y - 35) && Math.abs(pr.x - (z.x+50)) < 30) {
                        z.hp -= 20; projectiles.splice(pi, 1);
                    }
                });
            });

            plants = plants.filter(p => p.hp > 0);
            zombies = zombies.filter(z => z.hp > 0);
            Object.keys(cooldowns).forEach(k => { if(cooldowns[k] > 0) cooldowns[k]--; });
        }
    }

    draw();
    requestAnimationFrame(loop);
}

function draw() {
    ctx.clearRect(0,0,900,600);
    ctx.fillStyle = isNight ? '#1a237e' : '#4caf50'; ctx.fillRect(0,0,900,600);
    for(let i=0; i<9; i++) for(let j=0; j<6; j++) {
        ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.strokeRect(i*100, j*100, 100, 100);
    }
    
    plants.forEach(p => drawPlant(ctx, p.type, p.x, p.y, 100, 0, p.sleeping));
    zombies.forEach(z => drawZombie(z));
    projectiles.forEach(pr => { ctx.fillStyle = '#76ff03'; ctx.beginPath(); ctx.arc(pr.x, pr.y, 8, 0, Math.PI*2); ctx.fill(); });
    suns.forEach(s => { ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(s.x, s.y, 15, 0, Math.PI*2); ctx.fill(); });
    
    document.getElementById('sun-counter').innerText = `☀️ ${resources}`;
    document.getElementById('wave-bar').style.width = `${waveProgress}%`;
    document.getElementById('wave-text').innerText = `OLEADA ${wave}`;
}

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    
    // Recoger soles
    suns.forEach((s, i) => {
        if(Math.hypot(mx-s.x, my-s.y) < 40) { resources += 25; suns.splice(i, 1); }
    });

    const gx = Math.floor(mx/100)*100, gy = Math.floor(my/100)*100;
    if (selectedPlant && resources >= plantTypes[selectedPlant].cost && !plants.some(p => p.x === gx && p.y === gy)) {
        let sleeping = (isNight && plantTypes[selectedPlant].time === 'diurna') || (!isNight && plantTypes[selectedPlant].time === 'nocturna');
        plants.push({x: gx, y: gy, type: selectedPlant, hp: plantTypes[selectedPlant].hp, t: 0, sleeping: sleeping});
        resources -= plantTypes[selectedPlant].cost;
        selectedPlant = null;
    }
});

function togglePause() { isPaused = !isPaused; document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none'; }
document.getElementById('speed-btn').onclick = () => { gameSpeed = gameSpeed === 1 ? 2 : 1; document.getElementById('speed-btn').innerText = `x${gameSpeed}`; };
document.getElementById('pause-btn').onclick = togglePause;

// Inicializar botones de semillas dinámicamente
function updateUI() {
    const container = document.getElementById('seeds');
    container.innerHTML = '';
    playerDeck.forEach(k => {
        const div = document.createElement('div');
        div.className = 'seed';
        div.innerHTML = `<span>${plantTypes[k].cost}</span>`;
        div.onclick = () => { selectedPlant = k; };
        container.appendChild(div);
    });
}
window.onload = updateUI;
</script>
</body>
</html>
