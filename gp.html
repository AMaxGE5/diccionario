<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PvZ: Newspaper & Great Horde Edition</title>
    <style>
        body { background: #121212; color: white; font-family: 'Arial Black', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; user-select: none; }
        #ui-panel { width: 1050px; height: 110px; background: #4d3a29; display: flex; align-items: center; padding: 0 15px; box-sizing: border-box; border-bottom: 5px solid #241a12; gap: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #sun-counter { background: #ffd54f; color: #332; padding: 8px; border-radius: 10px; font-weight: bold; font-size: 22px; border: 4px solid #f57f17; min-width: 85px; text-align: center; }
        .seed-packets { display: flex; gap: 5px; }
        .seed { width: 75px; height: 95px; background: #795548; border: 3px solid #3e2723; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; border-radius: 5px; overflow: hidden; }
        .seed.selected { border-color: #fff; background: #a1887f; box-shadow: 0 0 15px #fff; transform: translateY(-3px); }
        .seed.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .seed.locked { background: #222; border-color: #000; cursor: not-allowed; }
        .seed .cooldown-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0,0,0,0.75); pointer-events: none; }
        .seed span { font-size: 11px; z-index: 2; font-weight: bold; text-shadow: 1px 1px #000; margin-top: 2px; }
        .control-btn { padding: 10px; border-radius: 8px; cursor: pointer; border: 3px solid #37474f; font-size: 20px; display: flex; align-items: center; justify-content: center; min-width: 55px; }
        #shovel { background: #607d8b; }
        #shovel.selected { background: #cfd8dc; border-color: white; transform: scale(1.1); }
        #speed-btn { background: #ff5722; color: white; font-weight: bold; font-size: 18px; }
        #game-container { position: relative; width: 900px; height: 600px; margin-top: 15px; border: 8px solid #3e2723; border-radius: 15px; }
        canvas { display: block; background: #4caf50; }
        #announcement { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ffeb3b; font-size: 44px; text-shadow: 4px 4px #000; display: none; z-index: 50; width: 100%; text-align: center; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

<div id="ui-panel">
    <div id="sun-counter">☀️ 150</div>
    <div class="seed-packets" id="seeds"></div>
    <div id="shovel" class="control-btn">🧹</div>
    <div id="speed-btn" class="control-btn">x1</div>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div id="announcement">¡SE ACERCA UNA GRAN HORDA!</div>
    <div id="overlay">
        <h1 id="status-text" style="font-size: 45px; color: #f44336;"></h1>
        <button style="padding: 15px 40px; font-size: 24px; cursor: pointer; background: #4caf50; color: white; border: none; border-radius: 10px;" onclick="location.reload()">REINTENTAR</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const cellSize = 100;

let resources = 150;
let frame = 0;
let gameSpeed = 1;
let wave = 1;
let waveProgress = 0;
const maxWaves = 10;
let gameOver = false;
let gameWon = false;

let selectedPlant = null;
let shovelActive = false;
let mouse = { x: 0, y: 0 };

const plants = [], zombies = [], projectiles = [], suns = [], mowers = [], explosions = [];

const plantTypes = {
    'lanzaguisantes': { cost: 100, hp: 100, color: '#4caf50', cooldown: 300 },
    'girasol': { cost: 50, hp: 80, color: '#ffeb3b', cooldown: 300 },
    'nuez': { cost: 50, hp: 2000, color: '#a1887f', cooldown: 900 },
    'repetidora': { cost: 200, hp: 100, color: '#1b5e20', cooldown: 400 },
    'plantorcha': { cost: 175, hp: 150, color: '#ff9800', cooldown: 400 },
    'hielaguisantes': { cost: 175, hp: 100, color: '#4fc3f7', cooldown: 500 },
    'papapum': { cost: 25, hp: 100, color: '#795548', cooldown: 800 },
    'petacereza': { cost: 150, hp: 100, color: '#f44336', cooldown: 1800 }
};

const cooldowns = { 'lanzaguisantes': 0, 'girasol': 0, 'nuez': 0, 'repetidora': 0, 'plantorcha': 0, 'hielaguisantes': 0, 'papapum': 0, 'petacereza': 0 };

function drawStrokeCircle(c, x, y, r) {
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.stroke();
}

function drawPlant(c, type, x, y, size, angle = 0, scale = 1, ready = true) {
    c.save();
    c.translate(x + size/2, y + size/2);
    c.rotate(angle);
    c.scale(scale, scale);
    c.strokeStyle = '#000'; c.lineWidth = 3;

    if (type === 'lanzaguisantes' || type === 'hielaguisantes' || type === 'repetidora') {
        c.fillStyle = '#2e7d32'; c.fillRect(-4, 0, 8, 35); c.strokeRect(-4, 0, 8, 35);
        c.fillStyle = plantTypes[type].color;
        if (type === 'repetidora') {
            c.beginPath(); c.ellipse(-20, -10, 10, 15, -0.5, 0, Math.PI*2); c.fill(); c.stroke();
            c.beginPath(); c.ellipse(-15, -25, 12, 18, -0.8, 0, Math.PI*2); c.fill(); c.stroke();
        }
        drawStrokeCircle(c, 2, -18, 22); 
        drawStrokeCircle(c, 24, -18, 12); 
        c.fillStyle = '#000'; drawStrokeCircle(c, 8, -24, 4); 
    } else if (type === 'girasol') {
        c.fillStyle = '#2e7d32'; c.fillRect(-3, 0, 6, 35); c.strokeRect(-3, 0, 6, 35);
        c.fillStyle = '#fbc02d';
        for(let i=0; i<8; i++){ c.rotate(Math.PI/4); c.beginPath(); c.ellipse(0, -20, 8, 15, 0, 0, Math.PI*2); c.fill(); c.stroke(); }
        c.fillStyle = '#5d4037'; drawStrokeCircle(c, 0, 0, 16);
    } else if (type === 'nuez') {
        c.fillStyle = '#8d6e63'; c.beginPath(); c.ellipse(0, 5, 32, 42, 0, 0, Math.PI*2); c.fill(); c.stroke();
        c.fillStyle = '#000'; drawStrokeCircle(c, -12, -10, 3.5); drawStrokeCircle(c, 12, -10, 3.5);
    } else if (type === 'plantorcha') {
        c.fillStyle = '#5d4037'; c.fillRect(-15, 10, 30, 25); c.strokeRect(-15, 10, 30, 25);
        c.fillStyle = (frame % 10 < 5) ? '#ff5722' : '#ff9800'; 
        c.beginPath(); c.moveTo(-20, 10); c.quadraticCurveTo(0, -50, 20, 10); c.fill(); c.stroke();
        c.fillStyle = '#ffeb3b'; drawStrokeCircle(c, 0, -5, 8);
    } else if (type === 'papapum') {
        if (!ready) { c.fillStyle = '#4e342e'; drawStrokeCircle(c, 0, 35, 12); }
        else { c.fillStyle = '#8d6e63'; c.beginPath(); c.ellipse(0, 25, 26, 20, 0, 0, Math.PI*2); c.fill(); c.stroke();
               c.fillStyle = (frame % 20 < 10) ? '#ff1744' : '#000'; drawStrokeCircle(c, 0, 0, 6); }
    } else if (type === 'petacereza') {
        c.fillStyle = '#d32f2f'; drawStrokeCircle(c, -20, 15, 24); drawStrokeCircle(c, 20, 15, 24);
        c.strokeStyle = '#2e7d32'; c.lineWidth = 5; c.beginPath(); c.moveTo(-15, -5); c.quadraticCurveTo(0, -30, 15, -5); c.stroke();
    }
    c.restore();
}

function drawZombie(z) {
    ctx.save();
    ctx.translate(z.x + 50, z.y + 50);
    const walkCycle = Math.sin(frame * (z.angry ? 0.3 : 0.15));
    const headBob = Math.abs(Math.cos(frame * 0.15)) * 4;
    ctx.rotate(walkCycle * 0.05);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;

    // Brazos
    ctx.fillStyle = z.freeze > 0 ? '#4fc3f7' : (z.angry ? '#d32f2f' : '#7cb342');
    ctx.fillRect(walkCycle * 3 - 35, -5, 30, 8); ctx.strokeRect(walkCycle * 3 - 35, -5, 30, 8);

    // Cuerpo
    ctx.fillStyle = (z.type === 'bandera' || z.type === 'pertiga') ? '#1a237e' : '#5d4037';
    if (z.type === 'periodico') ctx.fillStyle = '#455a64';
    ctx.fillRect(-20, -15, 40, 50); ctx.strokeRect(-20, -15, 40, 50);

    // Cabeza
    ctx.save();
    ctx.translate(0, -32 - headBob);
    ctx.fillStyle = z.freeze > 0 ? '#4fc3f7' : (z.angry ? '#f44336' : '#7cb342');
    drawStrokeCircle(ctx, 0, 0, 22);
    ctx.fillStyle = z.angry ? '#ffeb3b' : '#fff'; drawStrokeCircle(ctx, 8, -6, 6);
    ctx.fillStyle = '#000'; drawStrokeCircle(ctx, 10, -6, 2.5);
    ctx.restore();

    if (z.type === 'bandera') {
        ctx.strokeStyle = '#795548'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(15, 10); ctx.lineTo(15, -60); ctx.stroke();
        ctx.fillStyle = '#f44336'; ctx.fillRect(15, -60, 30, 20); ctx.strokeRect(15, -60, 30, 20);
    }
    
    if (z.type === 'periodico' && !z.angry) {
        ctx.fillStyle = '#cfd8dc'; ctx.fillRect(10, -10, 25, 35); ctx.strokeRect(10, -10, 25, 35);
        ctx.fillStyle = '#000'; ctx.fillRect(15, 0, 15, 2); ctx.fillRect(15, 10, 15, 2);
    }

    if (z.type === 'cono' && z.hp > 120) { ctx.fillStyle = '#ff6d00'; ctx.beginPath(); ctx.moveTo(-20, -42); ctx.lineTo(0, -90); ctx.lineTo(20, -42); ctx.fill(); ctx.stroke(); }
    else if (z.type === 'cubo' && z.hp > 120) { ctx.fillStyle = '#b0bec5'; ctx.fillRect(-24, -70, 48, 32); ctx.strokeRect(-24, -70, 48, 32); }
    ctx.restore();
}

function spawnZombie(count, typeOverride = null) {
    for (let i = 0; i < count; i++) {
        const r = Math.random();
        let type = typeOverride || 'basico', hp = 100 + (wave * 55), speed = 0.35;
        
        if (!typeOverride) {
            if (wave >= 2 && r > 0.8) { type = 'periodico'; hp = (100 + (wave * 55)) * 0.7; }
            else if (wave >= 3 && r > 0.7) { type = 'pertiga'; speed = 0.85; }
            else if (wave >= 5 && r > 0.5) { type = 'cubo'; hp += 900; }
            else if (wave >= 2 && r > 0.3) { type = 'cono'; hp += 400; }
        } else {
            type = typeOverride;
            if (type === 'periodico') hp = (100 + (wave * 55)) * 0.7;
        }

        zombies.push({
            x: 900 + (i * 35), 
            y: Math.floor(Math.random()*6)*cellSize, 
            hp: hp, maxHp: hp, 
            type: type, 
            speed: speed, 
            freeze: 0, 
            jumped: false,
            angry: false,
            eatSpeed: 1.2
        });
    }
}

function triggerHorde() {
    document.getElementById('announcement').style.display = 'block';
    setTimeout(() => { document.getElementById('announcement').style.display = 'none'; }, 3000);
    
    // Zombie bandera
    zombies.push({x: 900, y: Math.floor(Math.random()*6)*cellSize, hp: 150, type: 'bandera', speed: 0.5, freeze: 0});
    
    // Cantidad segun oleada: 6, 12, 18...
    spawnZombie(wave * 6);
}

function loop() {
    for (let s = 0; s < gameSpeed; s++) {
        frame++;
        Object.keys(cooldowns).forEach(k => { if (cooldowns[k] > 0) cooldowns[k]--; });

        // Progreso de la barra y Spawning
        if (frame % 150 === 0 && waveProgress < 100) {
            waveProgress += 2; 
            if (Math.random() > 0.7) spawnZombie(1); // Un explorador de vez en cuando
            
            if (waveProgress >= 100) {
                triggerHorde();
            }
        }

        // Pasar de oleada solo si no hay zombies y la barra esta llena
        if (waveProgress >= 100 && zombies.length === 0 && wave < maxWaves) {
            wave++;
            waveProgress = 0;
            updateUI();
        }

        if (frame % 400 === 0) suns.push({x: Math.random()*800+50, y: 0, targetY: Math.random()*400+100, t: 500});

        plants.forEach(p => {
            p.t++;
            if (p.type === 'girasol' && p.t % 600 === 0) suns.push({x: p.x+20, y: p.y+20, targetY: p.y+20, t: 500});
            if (['lanzaguisantes', 'hielaguisantes', 'repetidora'].includes(p.type) && p.t % 100 === 0) {
                if (zombies.some(z => z.y === p.y && z.x > p.x)) {
                    projectiles.push({x: p.x+80, y: p.y+35, ice: p.type === 'hielaguisantes', fire: false});
                    if (p.type === 'repetidora') p.ráfaga = 15;
                }
            }
            if (p.ráfaga > 0) { p.ráfaga--; if (p.ráfaga === 0) projectiles.push({x: p.x+80, y: p.y+35, ice: false, fire: false}); }
            if (p.type === 'papapum' && !p.ready && p.t > 400) p.ready = true;
        });

        zombies.forEach((z, i) => {
            // Logica Periodico
            if (z.type === 'periodico' && !z.angry && z.hp < z.maxHp / 2) {
                z.angry = true;
                z.speed *= 2.5;
                z.eatSpeed = 3.5;
            }

            let eating = false;
            plants.forEach(p => {
                if (z.y === p.y && z.x < p.x + 65 && z.x > p.x - 25) {
                    if (z.type === 'pertiga' && !z.jumped) { z.x -= 130; z.jumped = true; z.speed = 0.35; } 
                    else { eating = true; p.hp -= z.eatSpeed;
                        if (p.type === 'papapum' && p.ready) { z.hp = 0; p.hp = 0; explosions.push({x:p.x+50,y:p.y+50,r:115,t:12}); }
                    }
                }
            });
            if (!eating) z.x -= (z.freeze > 0 ? z.speed * 0.5 : z.speed);
            if (z.x < -60) gameOver = true;
            if (z.hp <= 0) zombies.splice(i, 1);
        });

        projectiles.forEach((pr, i) => {
            pr.x += 8;
            plants.filter(p => p.type === 'plantorcha').forEach(pl => {
                if (pr.x > pl.x && pr.x < pl.x + 50 && pr.y > pl.y && pr.y < pl.y + 100) {
                    if (pr.ice) pr.ice = false; else pr.fire = true;
                }
            });
            zombies.forEach(z => { 
                if (pr.x > z.x + 10 && pr.x < z.x+70 && pr.y > z.y && pr.y < z.y+100) { 
                    z.hp -= (pr.fire ? 40 : 20); 
                    if(pr.ice) z.freeze = 200; 
                    if(pr.fire) z.freeze = 0;
                    projectiles.splice(i, 1); 
                } 
            });
            if (pr.x > 920) projectiles.splice(i, 1);
        });

        mowers.forEach((m, i) => { 
            if (m.active) { 
                m.x += 12; 
                zombies.forEach(z => { if(z.y === m.y && z.x < m.x + 40) z.hp = 0; }); 
                if (m.x > 900) mowers.splice(i, 1); 
            } else if (zombies.some(z => z.y === m.y && z.x < 50)) m.active = true; 
        });

        suns.forEach((s, i) => { if (s.y < s.targetY) s.y += 2.5; s.t--; if (s.t <= 0) suns.splice(i, 1); });
        explosions.forEach((ex, i) => { ex.t--; if(ex.t <= 0) explosions.splice(i, 1); });
        plants.forEach((p, i) => { if (p.hp <= 0) plants.splice(i, 1); });
        if (wave === maxWaves && waveProgress >= 100 && zombies.length === 0) gameWon = true;
    }

    ctx.clearRect(0,0,900,600);
    for(let i=0; i<9; i++) { for(let j=0; j<6; j++) { ctx.fillStyle = (i+j)%2==0 ? '#4caf50' : '#43a047'; ctx.fillRect(i*100, j*100, 100, 100); } }
    mowers.forEach(m => { ctx.fillStyle = '#c62828'; ctx.fillRect(m.x, m.y+35, 55, 35); });
    plants.forEach(p => drawPlant(ctx, p.type, p.x, p.y, 100, Math.sin(frame*0.05)*0.04, 1, p.ready));
    zombies.forEach(z => drawZombie(z));
    projectiles.forEach(pr => { 
        ctx.fillStyle = pr.fire ? '#ff5722' : (pr.ice ? '#4fc3f7' : '#76ff03'); 
        drawStrokeCircle(ctx, pr.x, pr.y, 10); 
    });
    suns.forEach(s => { ctx.fillStyle = '#fff176'; ctx.strokeStyle = '#f57f17'; drawStrokeCircle(ctx, s.x, s.y, 20); });
    explosions.forEach(ex => { ctx.fillStyle = 'rgba(255, 100, 0, 0.7)'; drawStrokeCircle(ctx, ex.x, ex.y, ex.r); });

    if (gameOver) { document.getElementById('status-text').innerText = "¡SE COMIERON TUS CEREBROS!"; document.getElementById('overlay').style.display = 'flex'; return; }
    if (gameWon) { document.getElementById('status-text').innerText = "¡HAS GANADO!"; document.getElementById('overlay').style.display = 'flex'; return; }
    if (frame % 20 === 0) updateUI();
    requestAnimationFrame(loop);
}

function updateUI() {
    const container = document.getElementById('seeds');
    container.innerHTML = '';
    Object.keys(plantTypes).forEach(key => {
        const p = plantTypes[key];
        const isLocked = key === 'repetidora' && wave < 2;
        const div = document.createElement('div');
        div.className = `seed ${isLocked ? 'locked' : (resources < p.cost || cooldowns[key] > 0 ? 'disabled' : '')} ${selectedPlant === key ? 'selected' : ''}`;
        div.innerHTML = isLocked ? `<span>🔒 OLA 2</span>` : 
            `<canvas id="c-${key}" width="65" height="65"></canvas><span>${p.cost}</span><div class="cooldown-overlay" style="height: ${(cooldowns[key]/p.cooldown)*100}%"></div>`;
        div.onclick = () => { if (!isLocked && resources >= p.cost && cooldowns[key] <= 0) { selectedPlant = key; shovelActive = false; updateUI(); } };
        container.appendChild(div);
        if (!isLocked) { const ictx = document.getElementById(`c-${key}`).getContext('2d'); drawPlant(ictx, key, 0, 0, 65, 0, 0.7); }
    });
    document.getElementById('sun-counter').innerText = `☀️ ${resources}`;
}

for (let i = 0; i < 6; i++) mowers.push({x: 10, y: i * cellSize, active: false});
updateUI(); 
loop();
</script>
</body>
</html>
