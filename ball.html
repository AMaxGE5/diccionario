<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Red Ball 4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav-right">
  <a href="index.html" class="chip">Inicio</a>
  <a href="menu.html" class="chip">Menú</a>
  <a href="lista.html" class="chip">Lista de deseos</a>
  <a href="faq.html" class="chip">FAQ</a>
</nav>

<div class="center-wrap">
  <div class="center-card">

    <h2 class="title-glow">Red Ball 4 <span class="badge">clásico</span></h2>

    <p>Haz clic en el botón para jugar en una ventana segura.</p>

    <button class="btn-primary" onclick="abrirJuego()">▶ Jugar ahora</button>

    <p class="note-muted">
      Usa las flechas del teclado para mover y saltar.
    </p>

  </div>
</div>


<button id="gear" class="gear">⚙️</button>

<section id="sheet" class="sheet">

<div class="head">
<h3 class="m0">Notas de Red Ball</h3>
<button id="close-sheet" class="btn-ghost">Cerrar</button>
</div>

<div class="body">

<article class="card">

<h4 class="h4-tight">Info rápida</h4>

<p class="small">
Juego de plataformas donde controlas una bola roja que debe salvar el mundo de los cubos enemigos.
</p>

</article>

</div>

</section>


<script>

function abrirJuego(){

const win = window.open("about:blank","_blank")

const iframe = win.document.createElement("iframe")

iframe.src="https://baldis-basics-online.github.io/g22/class-491/"
iframe.style.border="none"
iframe.style.width="100%"
iframe.style.height="100%"

win.document.body.style.margin=0
win.document.body.appendChild(iframe)

}

const gear=document.getElementById("gear")
const sheet=document.getElementById("sheet")
const closeSheet=document.getElementById("close-sheet")

gear.onclick=()=>sheet.classList.add("open")
closeSheet.onclick=()=>sheet.classList.remove("open")

</script>

</body>
</html>
